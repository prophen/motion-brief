<!doctype html>
<!--
  Active theme is set on the <html> element below.
  To switch themes, change `data-theme` to any id defined in src/themes.ts.
  Color values per theme live in src/themes.css.
-->
<html lang="en" data-theme="motion-studio">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" type="image/png" href="/motionbrief-favicon-v3.png" />
    <meta
      name="description"
      content="Turn one creator prompt into an editable brief, campaign visual, and voiced concept package."
    />
    <title>MotionBrief — prompt to campaign concept</title>
    <!-- Keep sharing metadata in the HTML shell so crawlers need no JavaScript.
         Update the absolute URLs below if the production domain changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MotionBrief" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://motion-brief.app.space/" />
    <meta
      property="og:title"
      content="MotionBrief — prompt to campaign concept"
    />
    <meta
      property="og:description"
      content="Turn one creator prompt into an editable brief, campaign visual, and voiced concept package."
    />
    <meta
      property="og:image"
      content="https://motion-brief.app.space/landing-camera.webp"
    />
    <meta property="og:image:type" content="image/webp" />
    <meta
      property="og:image:alt"
      content="Instant camera on a train table in warm sunset light"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="MotionBrief — prompt to campaign concept"
    />
    <meta
      name="twitter:description"
      content="Turn one creator prompt into an editable brief, campaign visual, and voiced concept package."
    />
    <meta
      name="twitter:image"
      content="https://motion-brief.app.space/landing-camera.webp"
    />
    <meta
      name="twitter:image:alt"
      content="Instant camera on a train table in warm sunset light"
    />
    <!--
      First-paint background, keyed to the data-theme attribute above.
      Without this the browser paints white until the CSS bundle arrives —
      a hard flash on the dark themes. Each value mirrors --color-background
      in src/styles.css (slate) / src/themes.css; keep them in sync when
      adding or editing themes.
    -->
    <style>
      html {
        background-color: #0d0d0b;
        color-scheme: dark;
      }
      html[data-theme='paper'] {
        background-color: #ffffff;
        color-scheme: light;
      }
      /* Add one line per theme you create, mirroring its --color-background. */
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
